<svg viewBox="0 0 1000 950" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<rect x="0" y="0" width="1000" height="950" fill="#ffffff"/>

<!-- Title -->
<text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328">100X Research — F2B Process</text>
<text x="500" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">How a candidate moves from the research objective to a GitHub-persisted investment decision</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
</marker>
<marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#be123c"/>
</marker>
</defs>

<!-- Connectors -->
<line x1="470" y1="170" x2="558" y2="170" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="760" y1="240" x2="760" y2="278" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="560" y1="350" x2="472" y2="350" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="270" y1="420" x2="270" y2="458" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="470" y1="530" x2="558" y2="530" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="760" y1="600" x2="760" y2="638" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="560" y1="710" x2="472" y2="710" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Loop back: Learning -> Objective -->
<path d="M 70 710 L 30 710 L 30 170 L 68 170" fill="none" stroke="#be123c" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowLoop)"/>
<text x="18" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#be123c" letter-spacing="1" transform="rotate(-90 18 440)" text-anchor="middle">LEARNING LOOP</text>

<!-- Box 1: OBJECTIVE -->
<rect x="70" y="100" width="400" height="140" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
<circle cx="70" cy="100" r="18" fill="#1e3a8a"/>
<text x="70" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
<text x="96" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">OBJECTIVE</text>
<text x="96" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Find 50–100x candidates, 10–25+ yr horizon</text>
<text x="96" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Business outcomes first, not price targets</text>
<text x="96" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Valuation must still allow exceptional returns</text>

<!-- Box 2: DISCOVERY -->
<rect x="560" y="100" width="400" height="140" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
<circle cx="560" cy="100" r="18" fill="#0f766e"/>
<text x="560" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
<text x="586" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f766e">DISCOVERY</text>
<text x="586" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Global, sector-neutral search — no preset idea</text>
<text x="586" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Blind hunts vs. Sector Coverage Matrix</text>
<text x="586" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Small/mid-cap bias; large caps need strong case</text>

<!-- Box 3: RESEARCH -->
<rect x="560" y="280" width="400" height="140" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/>
<circle cx="560" cy="280" r="18" fill="#6d28d9"/>
<text x="560" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
<text x="586" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">RESEARCH (Framework)</text>
<text x="586" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• 13-part review: thesis, TAM, financials,</text>
<text x="586" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">  moat, management, market-cap math,</text>
<text x="586" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">  valuation, scenarios, risks, verdict, scores</text>

<!-- Box 4: AI REASONING & EVIDENCE -->
<rect x="70" y="280" width="400" height="140" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
<circle cx="70" cy="280" r="18" fill="#b45309"/>
<text x="70" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4</text>
<text x="96" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#b45309">AI REASONING &amp; EVIDENCE</text>
<text x="96" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• FACT vs INFERENCE vs SPECULATION, kept separate</text>
<text x="96" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Actively seek disconfirming evidence</text>
<text x="96" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Primary sources preferred and cited per claim</text>

<!-- Box 5: DECISION -->
<rect x="70" y="460" width="400" height="140" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<circle cx="70" cy="460" r="18" fill="#15803d"/>
<text x="70" y="466" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">5</text>
<text x="96" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15803d">DECISION</text>
<text x="96" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Status: CORE · WATCH · FRONTIER · REJECTED</text>
<text x="96" y="546" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Actions: thesis_health, position, capital</text>
<text x="96" y="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• 4 scores /10 + beyond_100x discovery flag</text>

<!-- Box 6: GITHUB -->
<rect x="560" y="460" width="400" height="140" rx="14" fill="#1f2328" stroke="#1f2328" stroke-width="3"/>
<circle cx="560" cy="460" r="18" fill="#ffffff"/>
<text x="560" y="466" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">6</text>
<text x="586" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">GITHUB (Source of Truth)</text>
<text x="586" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d0d7de">• universe.json (canonical) + schema.json</text>
<text x="586" y="546" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d0d7de">• Research .md files + RESEARCH_LOG.md</text>
<text x="586" y="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d0d7de">• Not chat memory — persisted with reasons</text>

<!-- Box 7: FUTURE RESEARCH -->
<rect x="560" y="640" width="400" height="140" rx="14" fill="#ffffff" stroke="#a16207" stroke-width="3"/>
<circle cx="560" cy="640" r="18" fill="#a16207"/>
<text x="560" y="646" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">7</text>
<text x="586" y="674" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#a16207">FUTURE RESEARCH</text>
<text x="586" y="702" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Next research question logged per company</text>
<text x="586" y="726" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• CORE-upgrade triggers &amp; review dates set</text>
<text x="586" y="750" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Queue prioritized by decision value</text>

<!-- Box 8: LEARNING -->
<rect x="70" y="640" width="400" height="140" rx="14" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
<circle cx="70" cy="640" r="18" fill="#be123c"/>
<text x="70" y="646" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">8</text>
<text x="96" y="674" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#be123c">LEARNING</text>
<text x="96" y="702" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Compare prior expectations vs outcomes</text>
<text x="96" y="726" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">• Extract lessons across companies</text>
<text x="96" y="750" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#be123c">• Feeds back into Objective &amp; Discovery</text>

<!-- Footer -->
<line x1="70" y1="805" x2="960" y2="805" stroke="#d0d7de" stroke-width="1"/>
<text x="500" y="832" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2328">Universe is not sacred: stronger evidence at any stage can displace an existing CORE/WATCH candidate.</text>
<text x="500" y="856" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Status is a research classification — not a buy / sell / hold recommendation.</text>
<text x="500" y="882" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8c959f">Source: PROJECT_INSTRUCTIONS.md · data/schema.md · DASHBOARD.md · INDEPENDENT_F2B_AUDIT.md §2</text>

</svg>
